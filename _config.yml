# title must match the page title derived from the README's first H1 by
# jekyll-titles-from-headings. When they match, the Primer layout suppresses its
# own site-title <h1> (_layouts/default.html: `if site.title != page.title`) and
# jekyll-seo-tag drops the redundant "| repo-name" suffix from <title>.
title: Awesome AI Coding Sandboxes
tagline: 37 ranked by security posture
description: Security-posture-first list of 37 sandboxes for running AI coding agents' code, ranked by isolation tier, network egress control and secrets brokering.

theme: jekyll-theme-primer

# Same value GitHub Pages injects in production; set explicitly so local /
# containerised builds of the github-pages gem resolve site.github metadata.
repository: fhiltscher/awesome-ai-coding-sandboxes

plugins:
  - jekyll-sitemap

# url/baseurl are injected by GitHub Pages for project sites — do not set them here.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og.png
        alt: "Awesome AI Coding Sandboxes — 37 sandboxes compared by isolation, egress control and secrets handling"

  # Single source for the content date: feeds <lastmod> in sitemap.xml
  # (jekyll-sitemap) and dateModified/datePublished in the JSON-LD graph
  # (_includes/head-custom.html). Keep in sync with the "Last updated" line in
  # README.md — that one is literal text because GitHub renders no Liquid.
  # Unquoted so YAML yields a Date; date_to_xmlschema needs one.
  - scope:
      path: "README.md"
    values:
      last_modified_at: 2026-08-03
      date_published: 2026-07-18
