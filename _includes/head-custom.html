<!-- jekyll-seo-tag emits og:image but not its dimensions; some scrapers need
     them to render a large card on first fetch. Kept in sync with script/og-image.py. -->
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />

<!-- jekyll-seo-tag emits twitter:title/image but no twitter:description; X falls
     back to og:description, other consumers of the card do not. -->
<meta name="twitter:description" content="{{ page.description | default: site.description | smartify | xml_escape }}" />

{% if page.url == '/' %}
<!-- Homepage only: the graph describes the comparison matrix, so emitting it on
     every page would duplicate the same @ids across URLs. Dates come from
     _config.yml defaults (scope README.md), the same source as sitemap lastmod. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Dataset",
      "@id": "{{ '/' | absolute_url }}#dataset",
      "name": "AI Coding Agent Sandboxes — Security Posture Comparison",
      "description": "Comparison of 37 sandbox platforms for running AI coding agent code, scored on isolation tier (microVM, gVisor, container, process), egress control (deny-default, allowlist, configurable, full-by-default), secrets handling (brokered vs env-in), hosting model, workspace state and license.",
      "url": "{{ '/' | absolute_url }}#comparison-matrix",
      "license": "https://creativecommons.org/publicdomain/zero/1.0/",
      "keywords": ["AI coding agents","sandbox","microVM","Firecracker","gVisor","egress control","secrets brokering","isolation"],
      "datePublished": "{{ page.date_published | date: '%Y-%m-%d' }}",
      "dateModified": "{{ page.last_modified_at | date: '%Y-%m-%d' }}",
      "isAccessibleForFree": true,
      "distribution": [
        {
          "@type": "DataDownload",
          "name": "README.md (source of the comparison matrix)",
          "encodingFormat": "text/markdown",
          "contentUrl": "https://raw.githubusercontent.com/{{ site.repository }}/main/README.md"
        }
      ],
      "variableMeasured": [
        {"@type": "PropertyValue", "name": "Isolation tier"},
        {"@type": "PropertyValue", "name": "Egress control"},
        {"@type": "PropertyValue", "name": "Secrets handling"},
        {"@type": "PropertyValue", "name": "Self-host / Managed"},
        {"@type": "PropertyValue", "name": "Workspace state"},
        {"@type": "PropertyValue", "name": "License"}
      ],
      "creator": {"@id": "https://github.com/fhiltscher#person"}
    },
    {
      "@type": "TechArticle",
      "@id": "{{ '/' | absolute_url }}#article",
      "headline": "Awesome AI Coding Sandboxes",
      "description": "{{ site.description | smartify | xml_escape }}",
      "image": "{{ '/assets/og.png' | absolute_url }}",
      "datePublished": "{{ page.date_published | date: '%Y-%m-%d' }}",
      "dateModified": "{{ page.last_modified_at | date: '%Y-%m-%d' }}",
      "inLanguage": "en-US",
      "license": "https://creativecommons.org/publicdomain/zero/1.0/",
      "author": {"@id": "https://github.com/fhiltscher#person"},
      "mainEntity": {"@id": "{{ '/' | absolute_url }}#dataset"},
      "mainEntityOfPage": "{{ '/' | absolute_url }}"
    },
    {
      "@type": "Person",
      "@id": "https://github.com/fhiltscher#person",
      "name": "Franz Hiltscher",
      "url": "https://github.com/fhiltscher",
      "knowsAbout": ["AI coding agents","sandbox isolation","microVMs","network egress control","secrets management"]
    }
  ]
}
</script>
{% endif %}
